brokerClusterName=pet-consult
brokerName=broker-consult
brokerId=0
namesrvAddr=127.0.0.1:9877
brokerIP1=127.0.0.1
listenPort=10912
autoCreateTopicEnable=true
deleteWhen=04
fileReservedTime=24
brokerRole=ASYNC_MASTER
flushDiskType=ASYNC_FLUSH
# 数据盘使用率 95%（模型占 33G），默认 75 阈值会拒绝写入；放宽到 97 并保留 3% 余量
# 注意：剩余空间仅约 2.6G，消息量小（任务通知 KB 级）足够；扩容/清理后建议调回 90
diskMaxUsedSpaceRatio=97
# 数据目录迁到 /autodl-fs/data（AutoFS 网络盘 200G），避免 /root/autodl-tmp 50G 数据盘
# （95% 满）被 1GB commitlog 预分配挤爆；commitlog 预分配降为 256MB。
storePathRootDir=/autodl-fs/data/rocketmq-consult/store
storePathCommitLog=/autodl-fs/data/rocketmq-consult/store/commitlog
mappedFileSizeCommitLog=268435456
