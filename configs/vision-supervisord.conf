[unix_http_server]
file=%(ENV_PET_CONSULT_ROOT)s/runtime/vision/supervisor.sock
chmod=0700

[supervisord]
logfile=%(ENV_PET_CONSULT_ROOT)s/runtime/vision/supervisord.log
pidfile=%(ENV_PET_CONSULT_ROOT)s/runtime/vision/supervisord.pid
childlogdir=%(ENV_PET_CONSULT_ROOT)s/runtime/vision
nodaemon=false

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://%(ENV_PET_CONSULT_ROOT)s/runtime/vision/supervisor.sock

[program:pet-consult-vllm]
directory=%(ENV_PET_CONSULT_ROOT)s
command=/bin/bash %(ENV_PET_CONSULT_ROOT)s/scripts/start_vllm.sh
autostart=true
autorestart=unexpected
startsecs=30
startretries=3
stopasgroup=true
killasgroup=true
stdout_logfile=%(ENV_PET_CONSULT_ROOT)s/runtime/vision/vllm.stdout.log
stderr_logfile=%(ENV_PET_CONSULT_ROOT)s/runtime/vision/vllm.stderr.log
environment=PYTHONUNBUFFERED="1",VLLM_ENFORCE_EAGER="0"

[program:pet-consult-vision]
directory=%(ENV_PET_CONSULT_ROOT)s
command=/bin/bash %(ENV_PET_CONSULT_ROOT)s/scripts/start_vision.sh
autostart=true
autorestart=unexpected
startsecs=10
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=%(ENV_PET_CONSULT_ROOT)s/runtime/vision/vision.stdout.log
stderr_logfile=%(ENV_PET_CONSULT_ROOT)s/runtime/vision/vision.stderr.log
environment=PYTHONUNBUFFERED="1"
