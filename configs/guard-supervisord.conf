[unix_http_server]
file=%(ENV_PET_CONSULT_ROOT)s/runtime/guard/supervisor.sock
chmod=0700

[supervisord]
logfile=%(ENV_PET_CONSULT_ROOT)s/runtime/guard/supervisord.log
pidfile=%(ENV_PET_CONSULT_ROOT)s/runtime/guard/supervisord.pid
childlogdir=%(ENV_PET_CONSULT_ROOT)s/runtime/guard
nodaemon=false

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://%(ENV_PET_CONSULT_ROOT)s/runtime/guard/supervisor.sock

[program:pet-consult-guard]
directory=%(ENV_PET_CONSULT_ROOT)s
command=/bin/bash %(ENV_PET_CONSULT_ROOT)s/scripts/start_guard.sh
autostart=true
autorestart=unexpected
startsecs=10
startretries=3
stopasgroup=true
killasgroup=true
stdout_logfile=%(ENV_PET_CONSULT_ROOT)s/runtime/guard/guard.stdout.log
stderr_logfile=%(ENV_PET_CONSULT_ROOT)s/runtime/guard/guard.stderr.log
environment=PYTHONUNBUFFERED="1"
