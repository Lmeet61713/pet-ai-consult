# Nginx / API Gateway（AutoDL 将容器 6006/6008 映射到同一公网 HTTPS :8443）
# 两个端口提供相同 API；API/模型/Redis 端口继续只监听本机。

worker_processes 2;
pid /root/autodl-tmp/projects/pet-consult/runtime/nginx/nginx.pid;
error_log /root/autodl-tmp/projects/pet-consult/runtime/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    access_log /root/autodl-tmp/projects/pet-consult/runtime/nginx/access.log;

    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    # AutoDL's edge proxy connects from loopback. Trust only that proxy when
    # restoring the original client address for the IP-level fallback limit.
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Preserve a caller-supplied trace ID; generate one only when absent.
    map $http_x_request_id $forwarded_request_id {
        default $http_x_request_id;
        ""      $request_id;
    }

    # ---- 请求体限制（图片 ≤3 张 × 5MB + 表单余量）----
    client_max_body_size 20m;
    client_body_timeout 30s;
    # Nginx worker 以 nobody 运行，不能穿越 /root 下的编译默认临时目录。
    client_body_temp_path /tmp/pet-consult-nginx-client-body 1 2;

    # ---- 限流（IP 级兜底，业务级限流在 FastAPI）----
    # limit_req_zone 已禁用（团队测试共享 IP，IP 限流无意义）
    limit_req_status 429;

    upstream consult_api {
        server 127.0.0.1:18100;
        keepalive 16;
    }

    upstream moderation_api {
        server 127.0.0.1:8110;
        keepalive 16;
    }

    server {
        listen 6006;
        listen 6008;
        server_name _;

        default_type application/json;

        error_page 413 = @payload_too_large;
        error_page 429 = @rate_limited;

        # 健康检查
        location /health/ {
            proxy_pass http://consult_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $forwarded_request_id;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            access_log off;
        }

        # SSE 必须关闭代理缓冲，否则后端会在连接末尾一次性收到所有事件。
        location = /api/v1/consult/stream {
            # limit_req 已禁用
            proxy_pass http://consult_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Request-Id $forwarded_request_id;
            proxy_buffering off;
            proxy_cache off;
            gzip off;
            add_header X-Accel-Buffering no always;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # 公网审核接口使用统一的 /api/v1 前缀，后端仍保持 internal 路由。
        location /api/v1/moderation/ {
            proxy_pass http://moderation_api/internal/moderation/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Request-Id $forwarded_request_id;
            proxy_read_timeout 120s;
            proxy_send_timeout 30s;
        }

        # 普通问诊接口。使用精确匹配，避免将管理接口意外暴露到公网。
        location = /api/v1/consult {
            proxy_pass http://consult_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Request-Id $forwarded_request_id;
            proxy_read_timeout 50s;   # > CONSULT_TOTAL_TIMEOUT_SECONDS(45)
            proxy_send_timeout 50s;
        }

        # 会话读取和删除接口。
        location /api/v1/conversations/ {
            proxy_pass http://consult_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Request-Id $forwarded_request_id;
            proxy_read_timeout 50s;
            proxy_send_timeout 50s;
        }

        location @payload_too_large {
            return 413 '{"status":"error","error":{"code":"PAYLOAD_TOO_LARGE","message":"请求体超过 20MB","retryable":false}}';
        }

        location @rate_limited {
            return 429 '{"status":"error","error":{"code":"RATE_LIMITED","message":"请求过于频繁，请稍后再试","retryable":true}}';
        }

        # 其余一律 404（不暴露其他路径）
        location / {
            return 404 '{"status":"error","error":{"code":"NOT_FOUND","message":"接口不存在","retryable":false}}';
        }
    }
}
