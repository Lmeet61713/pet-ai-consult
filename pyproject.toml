[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pet-consult"
version = "1.0.0"
description = "宠物问诊助手（目标规划 v5 / RTX 5090 完整工程架构版）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "redis>=5.0",
    "httpx>=0.27",
    "pillow>=10.0",
    "python-multipart>=0.0.9",
    "PyYAML>=6.0",
    "pyjwt>=2.8",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "asyncpg>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "fakeredis>=2.23",
    "ruff>=0.5",
    "aiosqlite>=0.20",
]
rag = [
    "numpy>=1.26",
    "jieba>=0.42",
]
mq = [
    "rocketmq-client-python>=2,<3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Keep CI, developer machines, and AutoDL independent of user-level Ruff configs.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
strict = true
